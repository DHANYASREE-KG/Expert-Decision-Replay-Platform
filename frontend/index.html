<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Decision Replay</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="toast" class="toast" role="status"></div>
  <section id="auth-screen" class="auth-screen min-h-screen">
    <div class="auth-art"><span class="eyebrow">EXPERT DECISION REPLAY</span><h1>Make the reasoning<br><em>visible.</em></h1><p>A living record of the decisions that move your organization forward.</p><div class="art-line"></div></div>
    <div class="auth-panel"><div class="brand-mark">DR<span>/</span></div><div id="auth-copy"><p class="eyebrow">WELCOME BACK</p><h2>Sign in to your workspace</h2><p class="muted">Continue where your team left off.</p></div>
      <form id="login-form" class="form-stack"><label>Email<input name="username" type="email" placeholder="you@company.com" required></label><label>Password<input name="password" type="password" placeholder="Your password" required minlength="6"></label><button class="button primary" type="submit">Enter workspace <span>&rarr;</span></button><p id="login-error" class="form-error"></p></form>
      <form id="register-form" class="form-stack hidden"><label>Full name<input name="full_name" placeholder="Your name" required></label><label>Work email<input name="email" type="email" placeholder="you@company.com" required></label><label>Password<input name="password" type="password" minlength="6" required></label><label>Role<select name="role"><option>Employee</option><option>Reviewer</option><option>Manager</option><option>Administrator</option></select></label><button class="button primary" type="submit">Create account <span>&rarr;</span></button><p id="register-error" class="form-error"></p></form>
      <button id="auth-toggle" class="text-button" type="button">Need an account? Register</button>
    </div>
  </section>
  <div id="app-shell" class="app-shell hidden min-vh-100">
    <aside class="sidebar"><div class="brand-mark">DR<span>/</span></div><div class="sidebar-label">Workspace</div><nav id="nav"></nav><div class="sidebar-foot"><div id="user-chip" class="user-chip"></div><button id="logout" class="text-button">Sign out</button></div></aside>
    <main class="main"><header class="topbar"><button id="menu-toggle" class="icon-button" aria-label="Open menu">&#9776;</button><div><p class="eyebrow" id="section-kicker">OVERVIEW</p><h2 id="page-title">Dashboard</h2></div><div class="topbar-actions"><span id="role-badge" class="role-badge"></span><button class="icon-button" title="Notifications">&#9671;</button></div></header><div id="content" class="content"></div></main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
